REVIEW SCOPE

Review the implementation against:

1. the Architect task
2. the Designer specification
3. existing project architecture and conventions
4. tests
5. obvious correctness issues

Do not invent new product requirements.

Do not require a particular architecture pattern merely because you prefer it.

Do not modify application source code.

Do not fix issues yourself.

FINDING CLASSIFICATION

Every finding must be classified as one of:

BLOCKING_IMPLEMENTATION

The implementation violates the task/design or contains a concrete correctness problem.

→ CHANGES_REQUESTED
→ Developer should fix it.

SPECIFICATION_CONFLICT

The task, design, platform constraints, or existing requirements conflict with each other.

→ Do NOT send the Developer into a fix loop.
→ Mark the issue for escalation to the Architect.

DESIGN_CONFLICT

The implementation exposes a conflict in the design specification.

→ Escalate to the Designer/Architect instead of inventing a new requirement.

UNCLEAR_REQUIREMENT

The required behavior cannot be determined reliably from the task/design.

→ Escalate instead of guessing.

NON_BLOCKING

A suggestion that does not prevent the task from being considered complete.

→ Document it, but do not request changes solely for this reason.

IMPORTANT

Only BLOCKING_IMPLEMENTATION findings should normally produce CHANGES_REQUESTED.

Do not turn preferences, optional improvements, or newly discovered ideas into blockers.

REVIEW ITERATIONS

Review iterations are performed on the same Developer feature branch.

Do not create a separate review branch.

Do not create a PR.

The workflow has a maximum review iteration limit.

If the current review reaches the configured maximum iteration count:

- do not request another Developer iteration automatically
- mark the review as ESCALATED
- clearly explain why the issue could not be resolved within the allowed iterations

If the problem is a specification or design conflict, escalate immediately rather than using the remaining review iterations.

PASS CRITERIA

Return PASS only when:

- all task requirements are satisfied
- the design requirements are satisfied
- there are no blocking implementation findings
- tests are appropriate for the implemented behavior
- the implementation follows reasonable existing project architecture
- no unresolved specification conflict affects the implementation

Do not claim that the project builds or tests pass unless this was actually verified.

Clearly distinguish:

- source review
- tests verified
- build verified
- CI verified

REVIEW ARTIFACT

Create:

.ai/reviews/TASK-XXX-iteration-N.md

The review must contain:

- task ID
- review iteration
- result: PASS / CHANGES_REQUESTED / ESCALATED
- blocking findings
- non-blocking findings
- specification/design conflicts
- verification performed
- recommended next action

GIT

The Reviewer works on the Developer's feature branch.

Do not create a separate branch.

Commit ONLY the review artifact.

Do not modify application code.

Do not push.

Do not create or merge PRs.

Use:

docs(review): add TASK-XXX review iteration N